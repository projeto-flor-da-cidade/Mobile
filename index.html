<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Ionic App</title>
    
    <base href="/" />
    
    <!-- Viewport para responsividade e mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Ícone da barra de status para iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SAFUC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Definir cor do tema para Android -->
    <!--<meta name="theme-color" content="#316cae" />

     Manifest do PWA -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Ícones para dispositivos Apple -->
    <link rel="apple-touch-icon" as="image" href="/src/assets/apple-touch-icon.jpg" />
    <link rel="icon" type="image/jpg" href="/src/assets/android-chrome.jpg" />
    <link rel="shortcut icon" href="/favicon.png" />

    <!-- Estilos do Leaflet (Mapas) -->
    <link rel="stylesheet" 
          href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
          integrity="sha512-xwEFevAx0mw8BawZ2m4u6O9khrbcpdP5HvbBfcpzXlUqoXtVnXm3IuZ+50ap1h9a3fNhE9IKVjJgP/5cZabzow=="
          crossorigin="" />

    <!-- SEO & Open Graph (Compartilhamento) -->
    <meta name="description" content="SAFUC - Aplicação Ionic para facilitar visitas e informações do Sítio Natan Vale" />
    <meta property="og:title" content="SAFUC - App Ionic" />
    <meta property="og:description" content="Aplicativo oficial do SAFUC para agendamento de visitas e informações." />
    <meta property="og:image" content="/src/assets/apple-touch-icon.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://seuapp.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SAFUC - App Ionic" />
    <meta name="twitter:description" content="Aplicativo oficial do SAFUC para visitas e informações." />
    <meta name="twitter:image" content="/src/assets/apple-touch-icon.jpg" />

    <!-- Segurança e Performance -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Pré-carregamento de scripts e fontes -->
    <!--<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin /> -->
    <!--<link rel="preload" href="/src/assets/apple-touch-icon.jpg" as="image" /> -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
